name: Build, Verify & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publikasikan APK Release ke GitHub Releases (memerlukan secrets signing)'
        type: boolean
        required: false
        default: false
      release_notes:
        description: 'Catatan Rilis Update APK (Opsional)'
        required: false
        default: 'Pembaruan Pattern-PRO (Keamanan, Alignment Engine & Validasi Sinyal).'

permissions:
  contents: read

jobs:
  ci-verify:
    name: Secret Scan, Lint, Unit Tests & Static Checks
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: 2. Secret & Credential Hygiene Scan
        run: |
          if grep -rnE "METAAPI_AUTH_TOKEN\s*=|METAAPI_ACCOUNT_ID\s*=" .env .env.example 2>/dev/null; then
            echo "ERROR: METAAPI credential property detected in .env files!"
            exit 1
          fi
          if grep -rnE "-----BEGIN [A-Z ]*PRIVATE KEY-----|eyJ[A-Za-z0-9_-]{15,}\.[A-Za-z0-9_-]{15,}\." app/src/main .env* 2>/dev/null; then
            echo "ERROR: Hardcoded token or private key detected in source!"
            exit 1
          fi
          echo "Secret scan passed."

      - name: 3. Setup JDK 21 (Temurin)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Configure Android SDK & Licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sudo mkdir -p "${SDK_DIR}/licenses" || mkdir -p "${SDK_DIR}/licenses"
          sudo chown -R "$(id -u):$(id -g)" "${SDK_DIR}" || true
          echo "ANDROID_HOME=${SDK_DIR}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_DIR}" >> "$GITHUB_ENV"
          printf "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n84831b9409646a918e30573bab4c9c91346d8abd\n" > "${SDK_DIR}/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n" > "${SDK_DIR}/licenses/android-sdk-preview-license"

      - name: 5. Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '9.3.1'

      - name: 6. Prepare Non-Secret Build Metadata (.env)
        env:
          CURRENT_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUM: ${{ github.run_number }}
        run: |
          if [[ "${REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VERSION_TAG="${REF_NAME}"
          else
            VERSION_TAG="v1.0.${RUN_NUM}"
          fi
          {
            echo "GITHUB_REPOSITORY=${CURRENT_REPO}"
            echo "APP_RELEASE_TAG=${VERSION_TAG}"
          } > .env

      - name: 7. Run Secret Check, Lint & Unit Tests via Wrapper
        run: |
          chmod +x ./gradlew
          ./gradlew :app:verifyNoEmbeddedSecrets :app:lintDebug :app:testDebugUnitTest --no-daemon --stacktrace

      - name: 8. Upload Test & Lint Reports
        if: always()
        uses: actions/upload-artifact@5d5d22a31266ced268874388b861e4b58bb5c2f3 # v4.3.1
        with:
          name: ci-reports-run-${{ github.run_number }}
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

  publish-release:
    name: Build Signed Release APK & Publish GitHub Release
    needs: ci-verify
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: 2. Setup JDK 21 (Temurin)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 3. Configure Android SDK & Licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sudo mkdir -p "${SDK_DIR}/licenses" || mkdir -p "${SDK_DIR}/licenses"
          sudo chown -R "$(id -u):$(id -g)" "${SDK_DIR}" || true
          echo "ANDROID_HOME=${SDK_DIR}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_DIR}" >> "$GITHUB_ENV"
          printf "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n84831b9409646a918e30573bab4c9c91346d8abd\n" > "${SDK_DIR}/licenses/android-sdk-license"

      - name: 4. Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '9.3.1'

      - name: 5. Restore Production Release Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "${KEYSTORE_BASE64}" ] || [ -z "${STORE_PASSWORD}" ] || [ -z "${KEY_PASSWORD}" ]; then
            echo "ERROR: Production signing secrets (KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD) are required."
            exit 1
          fi
          echo "${KEYSTORE_BASE64}" | base64 -d > "${GITHUB_WORKSPACE}/my-upload-key.jks"
          echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> "$GITHUB_ENV"

      - name: 6. Prepare Non-Secret Release Metadata (.env)
        env:
          CURRENT_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUM: ${{ github.run_number }}
        run: |
          if [[ "${REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VERSION_TAG="${REF_NAME}"
          else
            VERSION_TAG="v1.0.${RUN_NUM}"
          fi
          echo "VERSION_TAG=${VERSION_TAG}" >> "$GITHUB_ENV"
          {
            echo "GITHUB_REPOSITORY=${CURRENT_REPO}"
            echo "APP_RELEASE_TAG=${VERSION_TAG}"
          } > .env

      - name: 7. Verify No Embedded Secrets & Assemble Signed Release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:verifyNoEmbeddedSecrets :app:assembleRelease --no-daemon --stacktrace

      - name: 8. Package Release APK & Compute SHA-256 Checksum
        id: prepare_apk
        run: |
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "${APK_SRC}" ]; then
            echo "ERROR: Expected signed release APK not found at ${APK_SRC}"
            exit 1
          fi
          APK_NAME="Pattern-PRO-${VERSION_TAG}-release.apk"
          cp "${APK_SRC}" "${APK_NAME}"
          SHA256_SUM="$(sha256sum "${APK_NAME}" | awk '{print $1}')"
          echo "${SHA256_SUM}  ${APK_NAME}" > "${APK_NAME}.sha256"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA256_SUM}" >> "$GITHUB_OUTPUT"

      - name: 9. Cleanup Keystore Material from Workspace
        if: always()
        run: |
          rm -f "${GITHUB_WORKSPACE}/my-upload-key.jks" .env

      - name: 10. Upload Release Artifact & Checksum
        uses: actions/upload-artifact@5d5d22a31266ced268874388b861e4b58bb5c2f3 # v4.3.1
        with:
          name: APK-Release-${{ env.VERSION_TAG }}
          path: |
            ${{ steps.prepare_apk.outputs.apk_name }}
            ${{ steps.prepare_apk.outputs.apk_name }}.sha256
          if-no-files-found: error

      - name: 11. Publish Signed Release to GitHub Releases
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: "Release ${{ env.VERSION_TAG }} — Pattern-PRO"
          body: |
            ### Pembaruan Rilis APK (${{ env.VERSION_TAG }})
            - **Commit**: `${{ github.sha }}`
            - **Catatan**: ${{ github.event.inputs.release_notes || 'Rilis terverifikasi CI (lint, unit test, secret scan).' }}
            - **SHA-256 APK**: `${{ steps.prepare_apk.outputs.sha256 }}`

            #### Verifikasi Integritas Unduhan:
            Cocokkan hash SHA-256 APK terhadap file `.sha256` yang dilampirkan sebelum memasang pembaruan.
          files: |
            ${{ steps.prepare_apk.outputs.apk_name }}
            ${{ steps.prepare_apk.outputs.apk_name }}.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
